<footer class="site-footer">
  <div class="footer-links">
    {% assign printed_any = false %}
    {% for link in site.social %}
      {% if link.url and link.url != "" %}
        {% if printed_any %}<span class="dot">/</span>{% endif %}<a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.label }}</a>
        {% assign printed_any = true %}
      {% endif %}
    {% endfor %}
  </div>
  <div class="footer-copy">&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</div>
</footer>
